<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页主动画动态预览</title><style>
:root{--paper:#f4f0e9;--ink:#191816;--muted:#817b73;--line:#d8d0c5;--rust:#bd6549;--green:#70806a;--blue:#527486}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d8d2c9;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:radial-gradient(circle at 62% 43%,#fbfaf7 0,#f5f1eb 42%,#eee8df 100%);overflow:hidden;color:var(--ink)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.1),transparent 20%,transparent 80%,rgba(255,255,255,.12));z-index:30}.kicker{position:absolute;left:82px;top:54px;font-size:12px;letter-spacing:3px;font-weight:800;color:var(--rust);z-index:31}.kicker::before{content:"";display:inline-block;width:20px;height:2px;background:currentColor;margin-right:10px;vertical-align:4px}.copy{position:absolute;left:82px;top:151px;right:78px;z-index:12}.from{font-size:28px;font-weight:650;letter-spacing:7px;color:#4d4944}.hero{position:relative;margin-top:17px;width:456px;height:136px}.hero h1,.sweep h1{margin:0;font-size:122px;line-height:1;font-weight:850;letter-spacing:-8px;white-space:nowrap}.hero h1{color:rgba(27,26,24,.94);-webkit-text-fill-color:rgba(27,26,24,.94)}.subtitle{margin-top:27px;font-size:18px;line-height:1.6;color:#5d5953;font-weight:560}.case{position:absolute;left:82px;bottom:45px;font-size:13px;color:var(--muted);z-index:31}.baseline{position:absolute;left:82px;right:82px;bottom:83px;height:1px;background:var(--line);z-index:31}.semantic{position:absolute;right:83px;top:458px;width:350px;z-index:15}.semantic .row{display:grid;grid-template-columns:62px 1fr;gap:16px;align-items:center;margin:17px 0;font-size:14px;letter-spacing:1.2px;color:#55514c}.semantic b{font-size:13px;letter-spacing:3px}.semantic .eff b{color:var(--rust)}.semantic .qual b{color:var(--green)}.semantic i{display:block;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.55;margin-top:6px}.grain{position:absolute;inset:0;z-index:1;opacity:.08;background-image:radial-gradient(circle,rgba(43,40,37,.23) 0 .7px,transparent .8px);background-size:17px 17px;mask-image:linear-gradient(90deg,#000,transparent 15%,transparent 78%,#000)}
.field{position:absolute;inset:0;z-index:2}.field svg{width:100%;height:100%}.stream{fill:none;stroke:rgba(83,79,74,.16);stroke-width:1.05;stroke-linecap:round}.stream.fine{stroke:rgba(83,79,74,.085);stroke-width:.7}.stream.blue{stroke:rgba(82,116,134,.18)}.flow-r{fill:none;stroke:rgba(189,101,73,.67);stroke-width:1.65}.flow-g{fill:none;stroke:rgba(112,128,106,.69);stroke-width:1.65}.flow-r,.flow-g{stroke-dasharray:2 7;animation:flow 11s linear infinite}.moving{fill:rgba(82,116,134,.42);filter:drop-shadow(0 0 3px rgba(82,116,134,.18))}
@keyframes flow{to{stroke-dashoffset:-90}}
.sweep{position:absolute;left:-205px;top:151px;width:190px;height:238px;overflow:hidden;border-radius:47% 53% 44% 56%/17% 22% 78% 83%;z-index:20;background:linear-gradient(94deg,rgba(255,255,255,.03),rgba(255,255,255,.53) 43%,rgba(214,230,237,.18) 61%,rgba(255,255,255,.02));backdrop-filter:blur(3px) saturate(1.2);-webkit-backdrop-filter:blur(3px) saturate(1.2);border-left:1px solid rgba(255,255,255,.78);border-right:1px solid rgba(90,104,109,.09);box-shadow:17px 13px 46px rgba(64,61,57,.065),inset 1px 0 rgba(255,255,255,.88);animation:sweep 14s cubic-bezier(.36,.03,.64,.97) infinite}.sweep::after{content:"";position:absolute;left:43%;top:7%;width:3px;height:86%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.96) 19%,rgba(255,255,255,.42) 76%,transparent);filter:blur(.25px)}.sweep h1{position:absolute;left:287px;top:57px;color:rgba(245,249,250,.78);-webkit-text-fill-color:rgba(245,249,250,.78);-webkit-text-stroke:1.2px rgba(95,126,139,.46);text-shadow:-6px 1px 0 rgba(82,116,134,.18),7px 0 0 rgba(189,101,73,.12),0 18px 22px rgba(55,49,43,.12);animation:counter 14s cubic-bezier(.36,.03,.64,.97) infinite}.sweep .caustic{position:absolute;inset:-30px;background:linear-gradient(103deg,transparent 32%,rgba(255,255,255,.08) 43%,rgba(255,255,255,.92) 49%,rgba(255,255,255,.1) 55%,transparent 66%);mix-blend-mode:screen;animation:caustic 4.8s ease-in-out infinite alternate}
@keyframes sweep{0%{transform:translateX(0) scaleY(.96);opacity:0}6%{opacity:.9}45%{transform:translateX(610px) scaleY(1.03);opacity:.94}94%{opacity:.88}100%{transform:translateX(1480px) scaleY(.97);opacity:0}}
@keyframes counter{0%{transform:translateX(0)}45%{transform:translateX(-610px)}100%{transform:translateX(-1480px)}}
@keyframes caustic{from{transform:translateX(-45px) skewX(-6deg)}to{transform:translateX(45px) skewX(6deg)}}
.breath{position:absolute;left:822px;top:439px;width:390px;height:123px;border-radius:40%;background:radial-gradient(ellipse,rgba(255,255,255,.32),transparent 68%);animation:breath 7s ease-in-out infinite;z-index:3}@keyframes breath{0%,100%{opacity:.24;transform:scale(.98)}50%{opacity:.48;transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){.sweep,.sweep h1,.sweep .caustic,.flow-r,.flow-g,.breath{animation:none}.sweep{transform:translateX(610px);opacity:.9}.sweep h1{transform:translateX(-610px)}}
</style></head><body><main class="stage"><div class="grain"></div><div class="kicker">个人案例答辩</div><div class="field"><svg viewBox="0 0 1280 720" preserveAspectRatio="none"><g id="lines"></g><path class="flow-r" d="M-40 324 C170 287 300 347 474 318 S780 263 1010 305 S1192 337 1340 288"/><path class="flow-g" d="M-20 382 C188 416 316 355 500 392 S790 445 1008 402 S1204 363 1350 408"/><g id="movers"></g></svg></div><div class="copy"><div class="from">从人海作业到</div><div class="hero"><h1>数智协同</h1></div><div class="subtitle">输电运检外协管理提质增效模式探索与实践</div></div><div class="sweep"><h1>数智协同</h1><div class="caustic"></div></div><div class="breath"></div><div class="semantic"><div class="row eff"><b>增效</b><div>任务筛选更精准<i></i></div></div><div class="row qual"><b>提质</b><div>履职监督更全面<i></i></div></div></div><div class="baseline"></div><div class="case">案例编号：____</div></main><script>
const lines=document.getElementById('lines');for(let i=0;i<16;i++){const y=103+i*30+(i%3)*5,a=18+(i%5)*8,b=26+(i%7)*6;lines.insertAdjacentHTML('beforeend',`<path id="p${i}" class="stream ${i%4===0?'fine':i%7===0?'blue':''}" d="M-70 ${y} C160 ${y-a},280 ${y+b},470 ${y+(i%2?16:-16)} S790 ${y-(i%3)*13},1010 ${y+((i+1)%4)*12} S1200 ${y-10},1370 ${y+(i%5)*7}"/>`)}
const movers=document.getElementById('movers');for(let i=0;i<18;i++){const p=i%16,d=8+(i%5)*1.7,begin=-(i*.83%d);movers.insertAdjacentHTML('beforeend',`<circle class="moving" r="${i%4===0?2.1:1.25}"><animateMotion dur="${d}s" begin="${begin}s" repeatCount="indefinite"><mpath href="#p${p}"/></animateMotion></circle>`)}
function fit(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720))}addEventListener('resize',fit);fit();
</script></body></html>
