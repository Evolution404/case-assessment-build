name: Finalize case logic
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-case-logic.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['scripts/build_report.py','scripts/build_script.py','src/presentation.html','src/visuals.html']:
              p=Path(name); s=p.read_text(encoding='utf-8').replace('增效','提效').replace('提质','增质'); p.write_text(s,encoding='utf-8')
          p=Path('scripts/build_report.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('h1(doc,"二、内涵介绍")','h1(doc,"二、总体思路：构建“提效 + 增质”的外协数智管理模式")')
          s=s.replace('把相交、距离、密度、相似度等业务判断转成计算条件。','把相交、距离、活动区域、相似度等业务判断转成计算条件。')
          s=s.replace('h2(doc,"1.数据底账先行")\n    para(doc,"统一坐标、线路顺序、照片标识和任务关联字段，明确数据质量责任，为批量计算提供稳定输入。")','h2(doc,"1.建立外协任务数字筛选机制")\n    para(doc,"统一坐标、线路顺序和任务关联字段，以交叉跨越、防鸟、燃放点等专项为模板，把全量对象自动筛选为候选清单，形成“系统先筛、外协精准核验”的常态化任务组织方式。")')
          p.write_text(s,encoding='utf-8')
          p=Path('src/visuals.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('鸟害样本密度聚类，剔除噪声点，以凸包收敛重点区域，再叠加线路批量筛查。','GBIF鸟类活动数据结合公开生态资料形成重点活动区域，再与输电线路空间叠加，筛选外协重点核验区段。')
          s=s.replace('POINT → AREA','ACTIVITY AREA × LINE').replace('提效 · 聚类＋凸包','提效 · 活动数据叠加')
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/build_report.py scripts/build_script.py
          python3 -m json.tool content/case.json >/dev/null
          ! grep -R -E '增效|提质|密度聚类|聚类＋凸包' scripts/build_report.py scripts/build_script.py src/presentation.html src/visuals.html
          grep -q '工作量大' src/presentation.html
          grep -q '质量难保证' src/presentation.html
          grep -q 'GBIF' src/visuals.html
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_report.py scripts/build_script.py src/presentation.html src/visuals.html
          git commit -m 'fix: eliminate legacy case logic terminology'
          git push origin HEAD:main
