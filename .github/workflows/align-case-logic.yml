            ('提质轮：照片真实性全量验证','增质：照片查重强化外协履职质量监督'),
            ('接下来讲提质。','接下来讲增质。'),
            ('提质的关键，是把有限抽查变成机器全量筛选、人员终审认定。','增质的关键，是把外协质量监督从有限抽查变成机器全量筛选、管理人员重点复核。'),
            ('回到这项案例的两条主线。增效，让交叉跨越、防鸟和燃放点排查从人海摸排转向机器计算、人员核验；提质，让告警工单和巡视照片从有限抽查转向全量验证。','回到这项案例的两条主线。提效管任务，让交叉跨越、防鸟和燃放点等专项从外协全量摸排转向系统筛选、精准核验；增质管履职，让告警工单和巡视照片从有限抽查转向全量查重、异常重点复核。'),
          ])

          patch('README.md',[
            ('## 内容维护\n','## 逻辑基准\n\n所有报告、PPT、逐字稿和配图必须遵循 `docs/CASE-LOGIC-BASELINE.md`。主线固定为：**外协队伍管理 → 工作量大/质量难保证 → 提效/增质 → 数智协同管理**。\n\n## 内容维护\n')
          ])
          PY
      - name: Validate locked logic
        shell: bash
        run: |
          python3 -m py_compile scripts/build_report.py scripts/build_script.py
          python3 -m json.tool content/case.json >/dev/null
          grep -q '提效管任务' docs/CASE-LOGIC-BASELINE.md
          grep -q '工作量大' scripts/build_report.py
          grep -q '质量难保证' scripts/build_report.py
          grep -q 'GBIF' scripts/build_report.py
          ! grep -q '点聚类形成重点区域' scripts/build_report.py
          ! grep -q '密度聚类.*凸包重点' src/presentation.html
      - name: Commit aligned artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md scripts/build_report.py scripts/build_script.py src/presentation.html src/visuals.html
          git commit -m 'refactor: center case on external workforce management'
          git push origin HEAD:main
