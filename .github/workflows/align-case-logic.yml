name: Align case logic
on:
  push:
    branches: [main]
    paths: [.github/workflows/align-case-logic.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Align narrative
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old[:80]}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

