name: Render case figure review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-case-figure-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy pillow

      - name: Render ten review figures
        run: |
          rm -rf dist/figures review/figures
          mkdir -p dist/figures review/figures
          python scripts/build_management_figures.py
          python scripts/build_review_spatial_figures.py
          cp dist/figures/0[1-9]-*.png review/figures/
          cp dist/figures/10-*.png review/figures/
          test "$(find review/figures -maxdepth 1 -name '*.png' | wc -l)" -eq 10

      - name: Build contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          root=Path('review/figures')
          files=sorted(root.glob('[0-9][0-9]-*.png'))
          thumb_w, thumb_h = 960, 540
          margin=28
          cols=2
          rows=5
          sheet=Image.new('RGB',(cols*thumb_w+(cols+1)*margin,rows*thumb_h+(rows+1)*margin),(242,244,247))
          for i,path in enumerate(files):
              im=Image.open(path).convert('RGB')
              im=ImageOps.contain(im,(thumb_w,thumb_h))
              canvas=Image.new('RGB',(thumb_w,thumb_h),'white')
              canvas.paste(im,((thumb_w-im.width)//2,(thumb_h-im.height)//2))
              x=margin+(i%cols)*(thumb_w+margin)
              y=margin+(i//cols)*(thumb_h+margin)
              sheet.paste(canvas,(x,y))
          sheet.save(root/'00-十图审核总览.jpg',quality=90,optimize=True)
          PY

      - name: Commit review snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/figures
          if git diff --cached --quiet; then
            echo 'review figures unchanged'
          else
            git commit -m 'artifacts: render case figure review set'
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: case-figure-review
          path: review/figures
          retention-days: 14
